[project]
name = "mesquarebe"
version = "0.1.0"
description = "FastAPI backend for MeSquare"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.0",
    "llama-cloud>=2.19.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "alembic>=1.20.1",
]
